
# Isolated In-Memory Test Database
spring.datasource.url=jdbc:h2:mem:veritasvault_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Clean database state on every test execution
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Test JWT Key (Fast expiration)
app.jwt.secret=TestSecretKeyNeedToBeAtLeast256BitsLongForHS256AlgorithmTestingPurposesOnly
app.jwt.expiration-ms=3600000

# Mock Mail Configuration (Prevents tests from attempting to send actual emails)
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test@veritasvault.com
spring.mail.password=testpassword