spring.application.name=VeritasVault
server.port=8085

# Active profile: selects application-dev.properties by default
spring.profiles.active=dev

# Common upload storage configuration
app.storage.upload-dir=uploads
app.server.base-url=http://localhost:8085

# Multipart Upload Limits (Elevated for multi-gigabyte/large forensic evidence files)
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB