server:
  port: 8082

spring:
  application:
    name: case-evidence-service

  datasource:
    url: jdbc:postgresql://localhost:5432/veritas_db
    username: postgres
    password: postgrespassword
    driver-class-name: org.postgresql.Driver

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: case-evidence-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: "com.veritasvault.forensicvault.kafka.event.EvidenceTamperedEvent:com.veritasvault.caseevidence.kafka.event.EvidenceTamperedEvent"

app:
  storage:
    upload-dir: uploads
  server:
    base-url: http://localhost:8082

services:
  auth:
    url: ${AUTH_SERVICE_URL:http://localhost:8081}

jwt:
