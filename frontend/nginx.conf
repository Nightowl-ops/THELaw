server {
    listen 80;
    server_name localhost;

    # Allow large forensic evidence uploads (up to 500 MB)
    client_max_body_size 500M;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse proxy /api requests directly to api-gateway over the internal Docker network
    location /api/ {
        proxy_pass http://api-gateway:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # React Router SPA fallback (routes like /dashboard, /discovery, /external-discovery)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
