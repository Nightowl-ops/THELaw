server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        # Route 1: Auth & User Service
        - id: auth-service-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**, /api/admin/users/**

        # Route 2: Case & Evidence Service
        - id: case-evidence-service-route
          uri: http://localhost:8082
          predicates:
            - Path=/api/cases/**, /api/evidence/**, /api/binders/**, /api/discovery/**

        # Route 3: Forensic Lab & Custody Vault Service
        - id: forensic-vault-service-route
          uri: http://localhost:8083
          predicates:
            - Path=/api/reservations/**, /api/custody/**, /api/lab-reports/**
