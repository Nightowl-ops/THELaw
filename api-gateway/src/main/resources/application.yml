server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "*"
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers: "*"
            allow-credentials: true
      routes:
        # Route 1: Auth & User Service
        - id: auth-service-route
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**, /api/admin/users/**, /api/users/**

        # Route 2: Case & Evidence Service
        - id: case-evidence-service-route
          uri: ${CASE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/cases/**, /api/evidence/**, /api/binders/**, /api/discovery/**

        # Route 3: Forensic Lab, Custody Vault & Real-Time Telemetry Stream Service
        - id: forensic-vault-service-route
          uri: ${FORENSIC_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/reservations/**, /api/custody/**, /api/lab-reports/**, /api/notifications/**
